# ============================================================================
# Google Cloud Build Configuration for Ngam-je Celery Worker
# Deploys all-in-one Redis + Celery worker to Cloud Run
# ============================================================================

steps:
  # Step 1: Build the Celery worker Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.worker'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest'
      - '.'
    dir: 'backend'
    id: 'build-worker-image'

  # Step 2: Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}'
    id: 'push-worker-image'

  # Step 3: Deploy Celery worker to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-allow-unauthenticated'  # Workers don't need public access
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--timeout=${_TIMEOUT}'
      - '--concurrency=1'  # Process one task at a time per instance
      - '--service-account=${_SERVICE_ACCOUNT}'
      # Cloud SQL connection for database access
      - '--add-cloudsql-instances=gaia-capstone4-prd:asia-southeast1:ngamje-db-sea1'
      # VPC connector for Redis (Memorystore) access
      - '--vpc-connector=ngamje-vpc'
      # Environment variables from Secret Manager
      - '--set-secrets=POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,REDIS_URL=REDIS_URL:latest'
      # Environment variables (non-sensitive)
      - '--set-env-vars=ENV=production,DEBUG=false,GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION},POSTGRES_USER=postgres,POSTGRES_DB=ngamjedb,POSTGRES_HOST=/cloudsql/gaia-capstone4-prd:asia-southeast1:ngamje-db-sea1,INSTANCE_CONNECTION_NAME=gaia-capstone4-prd:asia-southeast1:ngamje-db-sea1'
      # No port mapping needed for workers
      - '--no-cpu-throttling'  # Keep CPU available even when idle
    id: 'deploy-worker'

# Substitutions (default values, can be overridden)
substitutions:
  _SERVICE_NAME: 'ngamje-worker'
  _REGION: 'asia-southeast1'
  _ARTIFACT_REGISTRY_REPO: 'ngamje'
  _MEMORY: '1Gi'  # Workers need more memory for AI tasks
  _CPU: '2'  # Workers need more CPU
  _MIN_INSTANCES: '1'  # Keep at least 1 worker running
  _MAX_INSTANCES: '5'  # Scale up to 5 workers under load
  _TIMEOUT: '600s'  # 10 minutes for long-running tasks
  _SERVICE_ACCOUNT: 'cloudrun@${PROJECT_ID}.iam.gserviceaccount.com'

# Images to be pushed to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Build timeout
timeout: '1200s'

# Available secrets for build steps
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/POSTGRES_PASSWORD/versions/latest
      env: 'POSTGRES_PASSWORD'
