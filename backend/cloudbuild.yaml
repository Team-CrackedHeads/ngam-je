# ============================================================================
# Google Cloud Build Configuration for Ngam-je Backend
# Automates building and deploying to Cloud Run
# ============================================================================

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest'
      - '.'
    dir: 'backend'
    id: 'build-image'

  # Step 2: Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}'
    id: 'push-image'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--timeout=${_TIMEOUT}'
      - '--concurrency=${_CONCURRENCY}'
      - '--port=8080'
      # Service account for Cloud SQL and other GCP services
      - '--service-account=${_SERVICE_ACCOUNT}'
      # VPC Connector for Cloud SQL private IP (if using)
      # - '--vpc-connector=${_VPC_CONNECTOR}'
      # Environment variables from Secret Manager
      - '--set-secrets=POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest,CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest,CLERK_PUBLISHABLE_KEY=CLERK_PUBLISHABLE_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,SERPAPI_API_KEY=SERPAPI_API_KEY:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest'
      # Environment variables (non-sensitive)
      - '--set-env-vars=ENV=production,DEBUG=false,GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION},USE_SECRET_MANAGER=true'
    id: 'deploy-to-cloud-run'

# Substitutions (default values, can be overridden)
substitutions:
  _SERVICE_NAME: 'ngamje-backend'
  _REGION: 'asia-southeast1'
  _ARTIFACT_REGISTRY_REPO: 'ngamje'
  _MEMORY: '512Mi'
  _CPU: '1'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _TIMEOUT: '300s'
  _CONCURRENCY: '80'
  _SERVICE_ACCOUNT: 'cloudrun@${PROJECT_ID}.iam.gserviceaccount.com'
  # _VPC_CONNECTOR: 'projects/${PROJECT_ID}/locations/${_REGION}/connectors/ngamje-vpc'

# Images to be pushed to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Build timeout
timeout: '1200s'
