# ============================================================================
# Google Cloud Build Configuration for Ngam-je Backend
# Automates building and deploying to Cloud Run
# ============================================================================

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest'
      - '.'
    dir: 'backend'
    id: 'build-image'

  # Step 2: Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}'
    id: 'push-image'

  # Step 3: Run database migrations
  - name: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'cd /app && /app/.venv/bin/alembic upgrade head'
    env:
      - 'ENV=production'
      - 'DEBUG=false'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_DB=ngamjedb'
      - 'INSTANCE_CONNECTION_NAME=gaia-capstone4-prd:asia-southeast1:ngamje-db-sea1'
    secretEnv:
      - 'POSTGRES_PASSWORD'
    id: 'run-migrations'

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--timeout=${_TIMEOUT}'
      - '--concurrency=${_CONCURRENCY}'
      - '--port=8080'
      # Service account for Cloud SQL and other GCP services
      - '--service-account=${_SERVICE_ACCOUNT}'
      # Cloud SQL connection
      - '--add-cloudsql-instances=gaia-capstone4-prd:asia-southeast1:ngamje-db-sea1'
      # VPC Connector for Redis (Memorystore) access
      - '--vpc-connector=ngamje-vpc'
      # Environment variables from Secret Manager
      - '--set-secrets=POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest,CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest,CLERK_PUBLISHABLE_KEY=CLERK_PUBLISHABLE_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,SERPAPI_API_KEY=SERPAPI_API_KEY:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,CLOUDINARY_CLOUD_NAME=CLOUDINARY_CLOUD_NAME:latest,CLOUDINARY_API_KEY=CLOUDINARY_API_KEY:latest,CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest,DIDIT_API_KEY=DIDIT_API_KEY:latest,DIDIT_WEBHOOK_SECRET=DIDIT_WEBHOOK_SECRET:latest,DIDIT_WORKFLOW_ID=DIDIT_WORKFLOW_ID:latest,UNSPLASH_ACCESS_KEY=UNSPLASH_ACCESS_KEY:latest,REDIS_URL=REDIS_URL:latest'
      # Environment variables (non-sensitive)
      - '--set-env-vars=ENV=production,DEBUG=false,GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION},USE_SECRET_MANAGER=true,CORS_ORIGINS=https://ngamje-frontend-645994298827.asia-southeast1.run.app,POSTGRES_USER=postgres,POSTGRES_DB=ngamjedb,POSTGRES_HOST=/cloudsql/gaia-capstone4-prd:asia-southeast1:ngamje-db-sea1,INSTANCE_CONNECTION_NAME=gaia-capstone4-prd:asia-southeast1:ngamje-db-sea1,DIDIT_BASE_URL=https://verification.didit.me,DIDIT_CALLBACK_URL=https://ngamje-backend-645994298827.asia-southeast1.run.app/api/v1/kyc/webhook'
    id: 'deploy-to-cloud-run'

  # Step 5: Deploy Celery Worker (triggered automatically with backend deployment)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'builds'
      - 'submit'
      - '--config=backend/cloudbuild.worker.yaml'
      - '--project=${PROJECT_ID}'
      - '--substitutions=SHORT_SHA=${SHORT_SHA}'
    id: 'deploy-celery-worker'

# Substitutions (default values, can be overridden)
substitutions:
  _SERVICE_NAME: 'ngamje-backend'
  _REGION: 'asia-southeast1'
  _ARTIFACT_REGISTRY_REPO: 'ngamje'
  _MEMORY: '512Mi'
  _CPU: '1'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _TIMEOUT: '300s'
  _CONCURRENCY: '80'
  _SERVICE_ACCOUNT: 'cloudrun@${PROJECT_ID}.iam.gserviceaccount.com'
  # _VPC_CONNECTOR: 'projects/${PROJECT_ID}/locations/${_REGION}/connectors/ngamje-vpc'

# Images to be pushed to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Build timeout
timeout: '1200s'

# Available secrets for build steps
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/POSTGRES_PASSWORD/versions/latest
      env: 'POSTGRES_PASSWORD'
