# Optional: Build job to ensure the app builds successfully
build:
  stage: build
  image: oven/bun:${BUN_VERSION}
  before_script:
    - cd frontend
    - bun install --frozen-lockfile
  script:
    - bun run build
  artifacts:
    paths:
      - frontend/.next/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Mirror to GitHub at 1:20 AM daily (only runs on scheduled pipelines)
mirror-to-github:
  stage: mirror
  image: alpine/git:latest
  needs: []                 # don’t wait for test/build
  when: always              # run even if other jobs fail
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - git config --global user.name "GitLab Mirror Bot"
    - git config --global user.email "noreply@gitlab.com"
  script:
    - git clone --mirror $CI_REPOSITORY_URL temp-clone
    - cd temp-clone
    - git remote set-url --push origin https://$GITHUB_TOKEN@github.com/Team-CrackedHeads/ngam-je.git
    - git push --mirror
