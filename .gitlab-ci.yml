# GitLab CI/CD configuration for frontend testing
# This pipeline runs tests on merge requests and main branch

stages:
  # - test  # Disabled - tests need to be rewritten
  - build
  - mirror

# Variables
variables:
  BUN_VERSION: "1.1.29"
  CACHE_KEY: "$CI_COMMIT_REF_SLUG-bun-cache"

# Cache for Bun
cache:
  key: $CACHE_KEY
  paths:
    - ~/.bun/install/cache/
    - frontend/node_modules/

