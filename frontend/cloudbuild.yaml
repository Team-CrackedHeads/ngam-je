# ============================================================================
# Google Cloud Build Configuration for Ngam-je Frontend
# Automates building and deploying Next.js to Cloud Run
# ============================================================================

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Building with NEXT_PUBLIC_API_URL=${_BACKEND_URL}"
        docker build \
          --build-arg "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$$CLERK_PUBLISHABLE_KEY" \
          --build-arg "NEXT_PUBLIC_API_URL=${_BACKEND_URL}" \
          --build-arg "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$$GOOGLE_MAPS_API_KEY" \
          --build-arg "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$$STRIPE_PUBLISHABLE_KEY" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest" \
          .
    dir: 'frontend'
    secretEnv: ['CLERK_PUBLISHABLE_KEY', 'GOOGLE_MAPS_API_KEY', 'STRIPE_PUBLISHABLE_KEY']
    id: 'build-image'

  # Step 2: Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}'
    id: 'push-image'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--timeout=${_TIMEOUT}'
      - '--concurrency=${_CONCURRENCY}'
      - '--port=8080'
      # Service account for accessing backend/services
      - '--service-account=${_SERVICE_ACCOUNT}'
      # Environment variables (add your frontend env vars here)
      - '--set-env-vars=NODE_ENV=production,NEXT_PUBLIC_API_URL=${_BACKEND_URL}'
      # Runtime secrets needed by middleware
      - '--set-secrets=CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest'
    id: 'deploy-to-cloud-run'

# Substitutions (default values, can be overridden)
substitutions:
  _SERVICE_NAME: 'ngamje-frontend'
  _REGION: 'asia-southeast1'
  _ARTIFACT_REGISTRY_REPO: 'ngamje'
  _MEMORY: '512Mi'
  _CPU: '1'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _TIMEOUT: '300s'
  _CONCURRENCY: '80'
  _SERVICE_ACCOUNT: 'cloudrun@${PROJECT_ID}.iam.gserviceaccount.com'
  _BACKEND_URL: 'https://ngamje-backend-645994298827.asia-southeast1.run.app'

# Images to be pushed to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Build timeout
timeout: '1200s'

# Available secrets from Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/gaia-capstone4-prd/secrets/CLERK_PUBLISHABLE_KEY/versions/latest
      env: 'CLERK_PUBLISHABLE_KEY'
    - versionName: projects/gaia-capstone4-prd/secrets/GOOGLE_MAPS_API_KEY/versions/latest
      env: 'GOOGLE_MAPS_API_KEY'
    - versionName: projects/gaia-capstone4-prd/secrets/STRIPE_PUBLISHABLE_KEY/versions/latest
      env: 'STRIPE_PUBLISHABLE_KEY'
