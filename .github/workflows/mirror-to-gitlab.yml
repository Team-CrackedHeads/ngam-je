name: Mirror to GitLab
on:
  schedule:
    - cron: '5 7 * * *'  # Daily at 7:05 AM UTC
  workflow_dispatch:   # manual trigger from the Actions tab

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitLab remote URL
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_URL:   ${{ secrets.GITLAB_URL }}
        run: |
          set -euo pipefail
          AUTH_URL="$(echo "$GITLAB_URL" | sed -E "s#https://#https://oauth2:${GITLAB_TOKEN}@#")"
          if git remote get-url gitlab >/dev/null 2>&1; then
            git remote set-url gitlab "$AUTH_URL"
          else
            git remote add gitlab "$AUTH_URL"
          fi

      - name: Push non-main branches (force only if needed)
        run: |
          set -euo pipefail
          echo "Pushing non-main branches..."
          for b in $(git for-each-ref --format='%(refname:short)' refs/heads/); do
            if [ "$b" != "main" ] && [ "$b" != "master" ]; then
              echo "→ refs/heads/$b"
              if ! git push gitlab "refs/heads/$b:refs/heads/$b"; then
                echo "   non-fast-forward, retrying with --force..."
                git push -f gitlab "refs/heads/$b:refs/heads/$b"
              fi
            else
              echo "Skipping main/master branch: $b"
            fi
          done

