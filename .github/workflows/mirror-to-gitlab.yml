name: Mirror non-main branches to GitLab

on:
  schedule:
    # 07:10 Asia/Kuala_Lumpur = 23:10 UTC (previous day)
    - cron: '10 23 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for all branches

      - name: Configure GitLab remote URL
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
        run: |
          set -euo pipefail
          AUTH_URL="$(echo "$GITLAB_URL" | sed -E "s#https://#https://oauth2:${GITLAB_TOKEN}@#")"
          if git remote get-url gitlab >/dev/null 2>&1; then
            git remote set-url gitlab "$AUTH_URL"
          else
            git remote add gitlab "$AUTH_URL"
          fi
          git fetch origin --prune

      - name: Determine default branch (origin/HEAD)
        id: defbranch
        run: |
          set -euo pipefail
          DEFAULT_BRANCH=$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's@^origin/@@')
          echo "default_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Default branch detected: $DEFAULT_BRANCH"

      - name: Create local branches from remote (excluding default)
        run: |
          set -euo pipefail
          DEFAULT="${{ steps.defbranch.outputs.default_branch }}"
          for remote_ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/); do
            branch="${remote_ref#origin/}"
            # Skip invalid branch names and default branch
            if [ "$branch" = "$DEFAULT" ] || [ "$branch" = "origin" ] || [ "$branch" = "HEAD" ]; then
              echo "Skipping branch: $branch"
              continue
            fi
            if git show-ref --quiet "refs/heads/$branch"; then
              echo "Local branch already exists: $branch"
            else
              echo "Creating local branch: $branch"
              git branch "$branch" "origin/$branch"
            fi
          done

      - name: Push all non-main branches to GitLab
        run: |
          set -euo pipefail
          DEFAULT="${{ steps.defbranch.outputs.default_branch }}"
          mapfile -t BRANCHES < <(git for-each-ref --format='%(refname:short)' refs/heads/)
          for branch in "${BRANCHES[@]}"; do
            if [ "$branch" = "$DEFAULT" ]; then
              echo "Skipping default branch: $branch"
              continue
            fi
            echo "🔄 Pushing branch: $branch"
            git push gitlab "$branch:$branch" || echo "⚠️ Warning: failed to push $branch"
          done

      - name: (Optional) Prune deleted branches from GitLab
        run: |
          git remote prune gitlab || echo "ℹ️ Skipped pruning"